# Centralized Configuration for TB Detection AI Agent

model:
  name: densenet121
  image_size: 224
  in_channels: 3
  num_classes: 1
  dropout_rate: 0.3
  pretrained: false
  version: tb-densenet121-v1.0

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  lr_scheduler: plateau
  patience: 3
  seed: 42

inference:
  threshold: 0.45
  device: auto
  enable_gradcam: true
  clahe_enabled: false
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8

paths:
  dataset_dir: ai_agent/dataset
  models_dir: ai_agent/models_ckpt
